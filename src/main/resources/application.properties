spring.application.name=VehicleManagementSystem
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:vehicle}?createDatabaseIfNotExist=true
spring.datasource.username=${MYSQL_USERNAME:springstudent}
spring.datasource.password=${MYSQL_PASSWORD:springstudent}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

spring.jpa.hibernate.ddl-auto=update
server.error.path=/error



