version: '3.8'
services:
  mysql:
    container_name: mysql
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=vehicle
    ports:
      - "3307:3306"
    volumes:
      - dbvol:/var/lib/mysql
    networks:
      - vehicle-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  vehicle-app:
    build: .
    container_name: vehicle-app
    ports:
      - "8080:8080"
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_USERNAME=root
      - MYSQL_PASSWORD=rootpassword
      - MYSQL_DATABASE=vehicle
      - MYSQL_PORT=3306
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - vehicle-network

networks:
  vehicle-network:
    name: vehicle-network

volumes:
  dbvol:
